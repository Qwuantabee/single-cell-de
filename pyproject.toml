[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scpipe"
version = "0.1.0"
description = "Single-cell differential expression done at the right level"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "scanpy>=1.10",
    "anndata>=0.10",
    "statsmodels>=0.14",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the downloaded dataset"]
